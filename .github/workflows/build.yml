name: Build Windows ZIP

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish application
        run: >-
          dotnet publish FH6Mod.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish

      - name: Create ZIP package
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath FH6AllInOneTrainer-win-x64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FH6AllInOneTrainer-win-x64
          path: FH6AllInOneTrainer-win-x64.zip
          if-no-files-found: error
          retention-days: 30
